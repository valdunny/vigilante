name: Vigilar calendario
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - env:
          TEMA: ${{ secrets.TEMA }}
          PRODUCTO: calendario-de-adviento-2026-wonderland-b
        run: |
          U="https://www.maquillajetrendyshop.com/api/catalog_system/pub/products/search/$PRODUCTO/p"
          FIN=$((SECONDS+3900))
          while [ $SECONDS -lt $FIN ]; do
            R=$(curl -s -A "Mozilla/5.0" "$U")
            P=$(echo "$R" | jq 'length' 2>/dev/null); P=${P:-0}
            Q=$(echo "$R" | jq '[.[].items[].sellers[].commertialOffer.AvailableQuantity] | add // 0' 2>/dev/null); Q=${Q:-0}
            echo "$(date +%T) productos:$P unidades:$Q"
            if [ "$Q" -gt 0 ]; then curl -s -H "Priority: urgent" -H "Tags: gift" -H "Click: https://www.maquillajetrendyshop.com/$PRODUCTO/p" -H "Email: jimenezxd01@gmail.com" -d "YA ESTA DISPONIBLE, corre" "ntfy.sh/$TEMA" >/dev/null; exit 0; fi
            sleep 10
          done

